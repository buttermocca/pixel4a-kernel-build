name: Build Pixel 4a Kernel (Auto KSU/KSU-Next/RSKS + SUSFS + BBR)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 저장 공간 확장
        uses: easimon/maximize-build-space@v8
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: 필수 빌드 도구 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev bison flex libelf-dev libsqlite3-dev git curl zip unzip python3 python-is-python3

      - name: Repo 도구 설치 및 커널 소스 다운로드
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH

          mkdir kernel_workspace
          cd kernel_workspace
          repo init -u https://android.googlesource.com/kernel/manifest -b android-msm-sunfish-4.14-android13 --depth=1
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      - name: KernelSU / KSU-Next / ReSuKiSU 최신 안정버전 자동 순차 적용
        run: |
          export GIT_TERMINAL_PROMPT=0
          cd kernel_workspace/private/msm-google

          # SUSFS 4.14 패치 다운로드
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.14 /tmp/susfs

          SUCCESS=0

          clean_ksu() {
            rm -rf drivers/kernelsu
            git checkout -- drivers/Kconfig drivers/Makefile 2>/devnull || true
          }

          # ====================================================
          # [1단계] 공식 KernelSU (tiann/KernelSU) 최신 안정 태그
          # ====================================================
          echo ">>> [1단계] 공식 KernelSU 최신 안정 버전 검색 중..."
          KSU_TAG=$(git ls-remote --tags --refs https://github.com/tiann/KernelSU.git | awk -F'/' '{print $3}' | grep -E '^v[0-9]+' | sort -V | tail -n1)

          if [ -n "$KSU_TAG" ]; then
            echo "발견된 KernelSU 최신 태그: $KSU_TAG"
            clean_ksu
            git clone -b "$KSU_TAG" https://github.com/tiann/KernelSU.git drivers/kernelsu

            if patch -p1 --forward --directory=drivers/kernelsu < /tmp/susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch; then
              echo "--> [성공] 공식 KernelSU ($KSU_TAG) + SUSFS 패치 적용 성공!"
              if [ -f "drivers/kernelsu/kernel/Kconfig" ]; then
                echo 'source "drivers/kernelsu/kernel/Kconfig"' >> drivers/Kconfig
                echo 'obj-y += kernelsu/kernel/' >> drivers/Makefile
              else
                echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
                echo 'obj-y += kernelsu/' >> drivers/Makefile
              fi
              SUCCESS=1
            else
              echo "--> [실패] 공식 KernelSU 최신버전과 SUSFS 패치 불일치. 2단계(KernelSU-Next)로 전환합니다."
            fi
          fi

          # ====================================================
          # [2단계] KernelSU-Next (rifsxd/KernelSU-Next) 최신 안정 태그
          # ====================================================
          if [ $SUCCESS -eq 0 ]; then
            echo ">>> [2단계] KernelSU-Next 최신 안정 버전 검색 중..."
            clean_ksu

            KSUN_TAG=$(git ls-remote --tags --refs https://github.com/rifsxd/KernelSU-Next.git | awk -F'/' '{print $3}' | grep -E '^v[0-9]+' | sort -V | tail -n1)
            if [ -z "$KSUN_TAG" ]; then
              KSUN_TAG="next"
            fi

            echo "발견된 KernelSU-Next 태그/브랜치: $KSUN_TAG"
            if git clone -b "$KSUN_TAG" https://github.com/rifsxd/KernelSU-Next.git drivers/kernelsu; then
              echo "--> [성공] KernelSU-Next ($KSUN_TAG) 저장소 직접 클론 완료!"
              if [ -f "drivers/kernelsu/kernel/Kconfig" ]; then
                echo 'source "drivers/kernelsu/kernel/Kconfig"' >> drivers/Kconfig
                echo 'obj-y += kernelsu/kernel/' >> drivers/Makefile
              else
                echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
                echo 'obj-y += kernelsu/' >> drivers/Makefile
              fi
              SUCCESS=1
            fi
          fi

          # ====================================================
          # [3단계] ReSuKiSU (rsuntk/ReSuKiSU) 최신 안정 태그
          # ====================================================
          if [ $SUCCESS -eq 0 ]; then
            echo ">>> [3단계] ReSuKiSU 최신 안정 버전 검색 중..."
            clean_ksu

            RSKS_TAG=$(git ls-remote --tags --refs https://github.com/rsuntk/ReSuKiSU.git | awk -F'/' '{print $3}' | grep -E '^v[0-9]+' | sort -V | tail -n1)
            if [ -z "$RSKS_TAG" ]; then
              RSKS_TAG="main"
            fi

            echo "발견된 ReSuKiSU 태그/브랜치: $RSKS_TAG"
            if git clone -b "$RSKS_TAG" https://github.com/rsuntk/ReSuKiSU.git drivers/kernelsu; then
              echo "--> [성공] ReSuKiSU ($RSKS_TAG) 저장소 직접 클론 완료!"
              if [ -f "drivers/kernelsu/kernel/Kconfig" ]; then
                echo 'source "drivers/kernelsu/kernel/Kconfig"' >> drivers/Kconfig
                echo 'obj-y += kernelsu/kernel/' >> drivers/Makefile
              else
                echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
                echo 'obj-y += kernelsu/' >> drivers/Makefile
              fi
              SUCCESS=1
            fi
          fi

          if [ $SUCCESS -eq 0 ]; then
            echo "에러: KernelSU / KSU-Next / ReSuKiSU 모듈을 다운로드하지 못했습니다."
            exit 1
          fi

          # ====================================================
          # 커널 소스 측 SUSFS 패치 (50_patch) 및 susfs.o 연결
          # ====================================================
          echo ">>> 커널 소스 측 SUSFS 패치 적용 중..."
          cp -r /tmp/susfs/kernel_patches/fs/* fs/ || true
          cp -r /tmp/susfs/kernel_patches/include/linux/* include/linux/ || true

          patch -p1 --forward < /tmp/susfs/kernel_patches/50_add_susfs_in_kernel-4.14.patch || true

          grep -q "susfs.o" fs/Makefile || echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile
          grep -q "susfs.o" fs/Makefile || echo 'obj-y += susfs.o' >> fs/Makefile

      - name: Defconfig 설정 및 구글 검사 로직 완전 무력화
        run: |
          cd kernel_workspace/private/msm-google

          # check_defconfig 검사 로직 물리적 제거
          find . -name "build.config*" -exec sed -i 's/check_defconfig//g' {} +
          find . -name "build.config*" -exec sh -c 'echo "POST_DEFCONFIG_CMDS=\"\"" >> "$1"' _ {} \;
          find ../build/ -type f -exec sed -i 's/check_defconfig//g' {} + 2>/devnull || true

          # sunfish_defconfig 옵션 강제 주입
          DEFCONFIG=$(find arch/arm64/configs -name "*sunfish_defconfig" | head -n 1)

          if [ -n "$DEFCONFIG" ]; then
            cat <<EOT >> $DEFCONFIG

          # KernelSU & SUSFS & BBR Configuration
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_MOUNT=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          EOT
          else
            echo "Defconfig 파일을 찾을 수 없습니다."
            exit 1
          fi

      - name: 커널 빌드
        run: |
          cd kernel_workspace
          export POST_DEFCONFIG_CMDS=""
          export SKIP_DEFCONFIG_CHECK=1
          export SKIP_MRPROPER=1

          LTO=thin BUILD_CONFIG=private/msm-google/build.config.sunfish ./build/build.sh

      - name: AnyKernel3 패키징
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          sed -i 's/device.name1=/device.name1=sunfish/g' anykernel.sh

          find ../kernel_workspace/out/ -name "Image.lz4-dtb" -exec cp {} . \; || cp ../kernel_workspace/out/android-msm-pixel-4.14/dist/Image* .

          zip -r9 Sunfish-Custom-Kernel.zip * -x .git README.md

      - name: 완제품 파일 업로드 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Sunfish-KernelSU-SUSFS
          path: AnyKernel3/Sunfish-Custom-Kernel.zip
