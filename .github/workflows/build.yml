name: Build Pixel 4a Sunfish Kernel
  # KernelSU-Next legacy-susfs-v2 + SUSFS + NoMount + BBR

on:
  workflow_dispatch:
    inputs:

      ksun_repo:
        description: "KernelSU-Next repository"
        required: true
        type: string
        default: "https://github.com/sidex15/KernelSU-Next.git"

      ksun_ref:
        description: "KernelSU-Next legacy SUSFS branch/tag/commit"
        required: true
        type: string
        default: "legacy-susfs-v2"

      susfs_repo:
        description: "SUSFS repository"
        required: true
        type: string
        default: "https://gitlab.com/simonpunk/susfs4ksu.git"

      susfs_ref:
        description: "SUSFS Linux 4.14 branch"
        required: true
        type: string
        default: "kernel-4.14"

      nomount_repo:
        description: "NoMount repository"
        required: true
        type: string
        default: "https://github.com/maxsteeel/nomount.git"

      nomount_ref:
        description: "NoMount branch/tag/commit"
        required: true
        type: string
        default: "master"

      anykernel3_repo:
        description: "AnyKernel3 repository"
        required: true
        type: string
        default: "https://github.com/osm0sis/AnyKernel3.git"

      anykernel3_ref:
        description: "AnyKernel3 branch/tag/commit"
        required: true
        type: string
        default: "master"


permissions:
  contents: read


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:

      # ============================================================
      # 1. Increase available disk space
      # ============================================================
      - name: 저장 공간 확장

        uses: easimon/maximize-build-space@v8

        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096

          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"


      # ============================================================
      # 2. Build dependencies
      # ============================================================
      - name: 필수 빌드 도구 설치

        shell: bash

        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            curl \
            device-tree-compiler \
            flex \
            git \
            libdw-dev \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            libsqlite3-dev \
            lz4 \
            pkg-config \
            python3 \
            python3-pip \
            python-is-python3 \
            rsync \
            unzip \
            zip

          echo
          echo "===== Tool versions ====="

          gcc --version | head -n 1
          clang --version | head -n 1
          git --version
          python3 --version
          lz4 --version | head -n 1


      # ============================================================
      # 3. Install Android Repo
      #
      # IMPORTANT:
      # GITHUB_PATH only affects subsequent workflow steps.
      # Therefore export PATH immediately as well.
      # ============================================================
      - name: Repo 도구 설치

        shell: bash

        run: |
          set -euo pipefail

          REPO_BIN="${HOME}/bin"

          mkdir -p "${REPO_BIN}"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${REPO_BIN}/repo"

          chmod 0755 "${REPO_BIN}/repo"

          # For following workflow steps
          echo "${REPO_BIN}" >> "${GITHUB_PATH}"

          # For THIS workflow step
          export PATH="${REPO_BIN}:${PATH}"

          echo
          echo "===== Repo verification ====="

          command -v repo
          repo --version


      # ============================================================
      # 4. Download Pixel 4a / Sunfish Android 13 kernel
      # ============================================================
      - name: Pixel 4a Sunfish 커널 소스 다운로드

        shell: bash

        run: |
          set -euo pipefail

          rm -rf "${GITHUB_WORKSPACE}/kernel_workspace"

          mkdir -p "${GITHUB_WORKSPACE}/kernel_workspace"

          cd "${GITHUB_WORKSPACE}/kernel_workspace"

          echo
          echo "=================================================="
          echo "Initializing Android kernel manifest"
          echo "Branch: android-msm-sunfish-4.14-android13"
          echo "=================================================="

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b android-msm-sunfish-4.14-android13 \
            --depth=1

          repo sync \
            -c \
            -j2 \
            --no-tags \
            --no-clone-bundle

          cd private/msm-google

          KERNEL_VERSION="$(make -s kernelversion)"

          echo
          echo "Detected kernel version:"
          echo "${KERNEL_VERSION}"

          case "${KERNEL_VERSION}" in
            4.14.*)
              echo "Pixel 4a 4.14 kernel confirmed."
              ;;
            *)
              echo
              echo "ERROR: Unexpected kernel version:"
              echo "${KERNEL_VERSION}"
              exit 1
              ;;
          esac


      # ============================================================
      # 5. KernelSU-Next legacy-susfs-v2
      #
      # DO NOT use setup.sh from another repository.
      #
      # Clone the complete KernelSU-Next repository so .git and
      # top-level uapi/ remain available.
      # ============================================================
      - name: KernelSU-Next legacy-susfs-v2 통합

        shell: bash

        env:
          KSUN_REPO: ${{ inputs.ksun_repo }}
          KSUN_REF: ${{ inputs.ksun_ref }}

        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}/kernel_workspace/private/msm-google"

          rm -rf KernelSU-Next
          rm -f drivers/kernelsu

          echo
          echo "=================================================="
          echo "KernelSU-Next"
          echo "Repository: ${KSUN_REPO}"
          echo "Ref:        ${KSUN_REF}"
          echo "=================================================="

          # --------------------------------------------------------
          # Clone repository without losing Git metadata
          # --------------------------------------------------------
          git clone \
            --filter=blob:none \
            --no-checkout \
            "${KSUN_REPO}" \
            KernelSU-Next

          cd KernelSU-Next

          # --------------------------------------------------------
          # Resolve branch / tag / commit
          # --------------------------------------------------------
          if git ls-remote \
              --exit-code \
              --heads \
              "${KSUN_REPO}" \
              "${KSUN_REF}" >/dev/null 2>&1; then

            echo "Using KernelSU-Next branch: ${KSUN_REF}"

            git fetch \
              --depth=50 \
              origin \
              "refs/heads/${KSUN_REF}:refs/remotes/origin/${KSUN_REF}"

            git checkout \
              --detach \
              "refs/remotes/origin/${KSUN_REF}"

          elif git ls-remote \
              --exit-code \
              --tags \
              "${KSUN_REPO}" \
              "refs/tags/${KSUN_REF}" >/dev/null 2>&1; then

            echo "Using KernelSU-Next tag: ${KSUN_REF}"

            git fetch \
              --depth=50 \
              origin \
              "refs/tags/${KSUN_REF}:refs/tags/${KSUN_REF}"

            git checkout \
              --detach \
              "${KSUN_REF}"

          else

            echo "Using KernelSU-Next commit: ${KSUN_REF}"

            git fetch \
              --depth=1 \
              origin \
              "${KSUN_REF}"

            git checkout \
              --detach \
              FETCH_HEAD

          fi

          # --------------------------------------------------------
          # Remove shallow state.
          #
          # KSU Kbuild calculates version from Git history.
          # --------------------------------------------------------
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then

            echo "Fetching complete KernelSU-Next history..."

            git fetch --unshallow

          fi

          echo
          echo "KernelSU-Next commit:"
          git rev-parse HEAD

          KSU_COMMIT="$(git rev-parse HEAD)"
          KSU_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"

          echo "KSUN_COMMIT=${KSU_COMMIT}" >> "${GITHUB_ENV}"
          echo "KSUN_TAG=${KSU_TAG}" >> "${GITHUB_ENV}"

          # --------------------------------------------------------
          # Required KernelSU-Next files
          # --------------------------------------------------------
          test -f kernel/Kbuild
          test -f kernel/Kconfig
          test -f kernel/policy/allowlist.h
          test -f uapi/app_profile.h

          # --------------------------------------------------------
          # Verify this really is the expected legacy SUSFS tree.
          # --------------------------------------------------------
          grep -Rqs \
            "CONFIG_KSU_SUSFS" \
            kernel/Kconfig

          grep -Rqs \
            "KSU_SUSFS" \
            kernel/Kbuild

          grep -Rqs \
            "ksu_handle_sys_reboot" \
            kernel

          grep -Rqs \
            "ksu_handle_execveat" \
            kernel

          grep -Rqs \
            "ksu_handle_vfs_read" \
            kernel

          # --------------------------------------------------------
          # Compatibility link:
          #
          # legacy-susfs-v2 policy/allowlist.h uses app_profile.h,
          # while the repository stores it under top-level uapi/.
          #
          # Keep upstream source untouched.
          # --------------------------------------------------------
          ln -sfn \
            ../uapi/app_profile.h \
            kernel/app_profile.h

          # Also expose uapi through kernel/uapi for source variants
          # that use "uapi/..." includes.
          ln -sfn \
            ../uapi \
            kernel/uapi

          test -f kernel/app_profile.h
          test -f kernel/uapi/app_profile.h

          cd ..

          # --------------------------------------------------------
          # Install KernelSU in the actual kernel tree.
          # --------------------------------------------------------
          ln -s \
            ../../KernelSU-Next/kernel \
            drivers/kernelsu

          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kbuild
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/app_profile.h
          test -f drivers/kernelsu/uapi/app_profile.h

          # --------------------------------------------------------
          # Kconfig
          # --------------------------------------------------------
          if ! grep -Fqx \
              'source "drivers/kernelsu/Kconfig"' \
              drivers/Kconfig; then

            printf '\nsource "drivers/kernelsu/Kconfig"\n' \
              >> drivers/Kconfig

          fi

          # --------------------------------------------------------
          # Makefile
          # --------------------------------------------------------
          if ! grep -Fqx \
              'obj-$(CONFIG_KSU) += kernelsu/' \
              drivers/Makefile; then

            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' \
              >> drivers/Makefile

          fi

          echo
          echo "KernelSU-Next integration complete."


      # ============================================================
      # 6. Manual KernelSU hooks for Linux 4.14
      #
      # IMPORTANT:
      # Do NOT use KSU_KPROBES_HOOK on this 4.14 kernel.
      #
      # We wire the required legacy manual hooks directly.
      # ============================================================
      - name: KernelSU-Next 4.14 manual hooks 적용

        shell: bash

        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}/kernel_workspace/private/msm-google"

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          ROOT = Path(".")

          def patch_function(path: str, pattern: str, snippet: str, name: str):
              p = ROOT / path
              text = p.read_text()

              # Already integrated
              if "ksu_handle_" in text:
                  if snippet.strip() in text:
                      print(f"[OK] {name}: already present")
                      return

              m = re.search(pattern, text, flags=re.MULTILINE)

              if not m:
                  print(f"[ERROR] {name}: target function not found: {path}")
                  sys.exit(1)

              brace = text.find("{", m.end())

              if brace == -1:
                  print(f"[ERROR] {name}: function opening brace not found")
                  sys.exit(1)

              new_text = (
                  text[:brace + 1]
                  + "\n\n"
                  + snippet
                  + "\n"
                  + text[brace + 1:]
              )

              p.write_text(new_text)

              # Validate insertion
              verify = p.read_text()

              if "ksu_handle_" not in verify:
                  print(f"[ERROR] {name}: insertion verification failed")
                  sys.exit(1)

              print(f"[OK] {name}: patched")


          # --------------------------------------------------------
          # kernel/reboot.c
          # Required by KernelSU-Next Kbuild manual-hook check.
          # --------------------------------------------------------
          reboot_hook = r'''
          #ifdef CONFIG_KSU
              ksu_handle_sys_reboot(magic1, magic2, cmd, arg);
          #endif
          '''

          reboot_extern = r'''
          #ifdef CONFIG_KSU
          extern int ksu_handle_sys_reboot(
              int magic1,
              int magic2,
              unsigned int cmd,
              void __user *arg
          );
          #endif
          '''

          p = ROOT / "kernel/reboot.c"
          text = p.read_text()

          if "ksu_handle_sys_reboot" not in text:

              # Add declaration near the beginning.
              include_end = 0

              for match in re.finditer(r"^#include .*?$", text, re.MULTILINE):
                  include_end = match.end()

              if include_end == 0:
                  print("[ERROR] reboot.c: include section not found")
                  sys.exit(1)

              text = (
                  text[:include_end]
                  + "\n"
                  + reboot_extern
                  + "\n"
                  + text[include_end:]
              )

              p.write_text(text)

          patch_function(
              "kernel/reboot.c",
              r"SYSCALL_DEFINE4\s*\(\s*reboot\b",
              reboot_hook,
              "sys_reboot"
          )


          # --------------------------------------------------------
          # fs/exec.c
          # --------------------------------------------------------
          exec_hook = r'''
          #ifdef CONFIG_KSU
              extern bool ksu_execveat_hook __read_mostly;
              extern int ksu_handle_execveat(
                  int *fd,
                  struct filename **filename_ptr,
                  void *argv,
                  void *envp,
                  int *flags
              );
              extern int ksu_handle_execveat_sucompat(
                  int *fd,
                  struct filename **filename_ptr,
                  void *argv,
                  void *envp,
                  int *flags
              );

              if (unlikely(ksu_execveat_hook))
                  ksu_handle_execveat(
                      &fd,
                      &filename,
                      &argv,
                      &envp,
                      &flags
                  );
              else
                  ksu_handle_execveat_sucompat(
                      &fd,
                      &filename,
                      &argv,
                      &envp,
                      &flags
                  );
          #endif
          '''

          patch_function(
              "fs/exec.c",
              r"static\s+int\s+do_execveat_common\s*\(",
              exec_hook,
              "execveat"
          )


          # --------------------------------------------------------
          # fs/read_write.c
          # --------------------------------------------------------
          read_hook = r'''
          #ifdef CONFIG_KSU
              extern int ksu_handle_vfs_read(
                  struct file **file_ptr,
                  char __user **buf_ptr,
                  size_t *count_ptr,
                  loff_t **pos_ptr
              );

              ksu_handle_vfs_read(
                  &file,
                  &buf,
                  &count,
                  &pos
              );
          #endif
          '''

          patch_function(
              "fs/read_write.c",
              r"\bssize_t\s+vfs_read\s*\(",
              read_hook,
              "vfs_read"
          )


          # --------------------------------------------------------
          # Verify manual hooks.
          # --------------------------------------------------------
          required = [
              ("kernel/reboot.c", "ksu_handle_sys_reboot"),
              ("fs/exec.c", "ksu_handle_execveat"),
              ("fs/read_write.c", "ksu_handle_vfs_read"),
          ]

          for file_name, symbol in required:
              text = (ROOT / file_name).read_text()

              if symbol not in text:
                  print(
                      f"[ERROR] Manual hook verification failed: "
                      f"{file_name}: {symbol}"
                  )
                  sys.exit(1)

          print()
          print("==================================================")
          print("All required KernelSU-Next manual hooks detected.")
          print("==================================================")
          PY


      # ============================================================
      # 7. SUSFS Linux 4.14
      #
      # Do NOT apply 10_enable_susfs_for_ksu.patch here.
      #
      # The selected KernelSU-Next source is already the
      # legacy-susfs-v2 integration branch.
      #
      # Only the kernel-side SUSFS files + 4.14 kernel patch
      # are integrated here.
      # ============================================================
      - name: SUSFS 4.14 통합

        shell: bash

        env:
          SUSFS_REPO: ${{ inputs.susfs_repo }}
          SUSFS_REF: ${{ inputs.susfs_ref }}

        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}/kernel_workspace/private/msm-google"

          rm -rf SUSFS

          echo
          echo "=================================================="
          echo "SUSFS"
          echo "Repository: ${SUSFS_REPO}"
          echo "Ref:        ${SUSFS_REF}"
          echo "=================================================="

          git clone \
            --filter=blob:none \
            --depth=1 \
            --branch "${SUSFS_REF}" \
            "${SUSFS_REPO}" \
            SUSFS

          cd SUSFS

          SUSFS_COMMIT="$(git rev-parse HEAD)"

          echo "SUSFS commit:"
          echo "${SUSFS_COMMIT}"

          echo "SUSFS_COMMIT=${SUSFS_COMMIT}" \
            >> "${GITHUB_ENV}"

          test -f \
            kernel_patches/50_add_susfs_in_kernel-4.14.patch

          test -f \
            kernel_patches/fs/susfs.c

          test -f \
            kernel_patches/include/linux/susfs.h

          cd ..

          # --------------------------------------------------------
          # Copy SUSFS implementation files
          # --------------------------------------------------------
          rsync \
            -a \
            SUSFS/kernel_patches/fs/ \
            fs/

          rsync \
            -a \
            SUSFS/kernel_patches/include/linux/ \
            include/linux/

          # --------------------------------------------------------
          # If fs/Makefile already contains the SUSFS object and the
          # SUSFS source/header already exist, assume this portion
          # has already been integrated.
          #
          # Otherwise require the complete patch to apply.
          # --------------------------------------------------------
          if \
            grep -Fq \
              'obj-$(CONFIG_KSU_SUSFS) += susfs.o' \
              fs/Makefile \
            && \
            test -f fs/susfs.c \
            && \
            test -f include/linux/susfs.h
          then

            echo
            echo "SUSFS kernel wiring already exists."
            echo "Checking remaining 4.14 patch state..."

            if grep -Fq \
                'susfs_is_sus_path' \
                fs/namei.c \
                && \
                grep -Fq \
                'susfs_sus_mount' \
                fs/namespace.c; then

              echo "SUSFS 4.14 kernel modifications appear present."

            else

              echo "Existing SUSFS files detected but patch wiring is incomplete."

              echo "Applying 4.14 SUSFS patch..."

              git apply \
                --check \
                SUSFS/kernel_patches/50_add_susfs_in_kernel-4.14.patch

              git apply \
                --index \
                SUSFS/kernel_patches/50_add_susfs_in_kernel-4.14.patch

            fi

          else

            echo
            echo "Applying SUSFS 4.14 kernel patch..."

            git apply \
              --check \
              SUSFS/kernel_patches/50_add_susfs_in_kernel-4.14.patch

            git apply \
              --index \
              SUSFS/kernel_patches/50_add_susfs_in_kernel-4.14.patch

          fi

          # --------------------------------------------------------
          # Strict verification.
          # --------------------------------------------------------
          test -f fs/susfs.c
          test -f include/linux/susfs.h

          grep -Fq \
            'obj-$(CONFIG_KSU_SUSFS) += susfs.o' \
            fs/Makefile

          grep -Rqs \
            'KSU_SUSFS' \
            fs include/linux

          echo
          echo "SUSFS integration complete."


      # ============================================================
      # 8. NoMount built-in integration
      #
      # Legacy kernel < 5.10:
      # native kernel integration is required.
      # ============================================================
      - name: NoMount 통합

        shell: bash

        env:
          NOMOUNT_REPO: ${{ inputs.nomount_repo }}
          NOMOUNT_REF: ${{ inputs.nomount_ref }}

        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}/kernel_workspace/private/msm-google"

          rm -rf NoMount

          echo
          echo "=================================================="
          echo "NoMount"
          echo "Repository: ${NOMOUNT_REPO}"
          echo "Ref:        ${NOMOUNT_REF}"
          echo "=================================================="

          git clone \
            --filter=blob:none \
            --no-checkout \
            "${NOMOUNT_REPO}" \
            NoMount

          cd NoMount

          if git ls-remote \
              --exit-code \
              --heads \
              "${NOMOUNT_REPO}" \
              "${NOMOUNT_REF}" >/dev/null 2>&1; then

            git fetch \
              --depth=1 \
              origin \
              "refs/heads/${NOMOUNT_REF}:refs/remotes/origin/${NOMOUNT_REF}"

            git checkout \
              --detach \
              "refs/remotes/origin/${NOMOUNT_REF}"

          elif git ls-remote \
              --exit-code \
              --tags \
              "${NOMOUNT_REPO}" \
              "refs/tags/${NOMOUNT_REF}" >/dev/null 2>&1; then

            git fetch \
              --depth=1 \
              origin \
              "refs/tags/${NOMOUNT_REF}:refs/tags/${NOMOUNT_REF}"

            git checkout \
              --detach \
              "${NOMOUNT_REF}"

          else

            git fetch \
              --depth=1 \
              origin \
              "${NOMOUNT_REF}"

            git checkout \
              --detach \
              FETCH_HEAD

          fi

          NOMOUNT_COMMIT="$(git rev-parse HEAD)"

          echo "NoMount commit:"
          echo "${NOMOUNT_COMMIT}"

          echo "NOMOUNT_COMMIT=${NOMOUNT_COMMIT}" \
            >> "${GITHUB_ENV}"

          test -d kernel/src
          test -f kernel/README.md

          cd ..

          rm -rf fs/nomount

          mkdir -p fs/nomount

          rsync \
            -a \
            NoMount/kernel/src/ \
            fs/nomount/

          # --------------------------------------------------------
          # fs/Kconfig
          # --------------------------------------------------------
          if ! grep -Fqx \
              'source "fs/nomount/Kconfig"' \
              fs/Kconfig; then

            printf '\nsource "fs/nomount/Kconfig"\n' \
              >> fs/Kconfig

          fi

          # --------------------------------------------------------
          # fs/Makefile
          # --------------------------------------------------------
          if ! grep -Fqx \
              'obj-$(CONFIG_NOMOUNT) += nomount/' \
              fs/Makefile; then

            printf '\nobj-$(CONFIG_NOMOUNT) += nomount/\n' \
              >> fs/Makefile

          fi

          test -f fs/nomount/Kconfig

          grep -Rqs \
            'config NOMOUNT' \
            fs/nomount

          echo
          echo "NoMount source integration complete."


      # ============================================================
      # 9. Defconfig
      #
      # IMPORTANT:
      # No KPROBE hook.
      # No CONFIG_KSU_KPROBES_HOOK=y.
      #
      # Linux 4.14 -> KernelSU manual hooks.
      # ============================================================
      - name: Defconfig 설정

        shell: bash

        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}/kernel_workspace/private/msm-google"

          DEFCONFIG="arch/arm64/configs/sunfish_defconfig"

          test -f "${DEFCONFIG}"

          # --------------------------------------------------------
          # Remove duplicate / conflicting settings first.
          # --------------------------------------------------------
          remove_config() {
            local key="$1"

            sed -i \
              -e "/^[[:space:]]*CONFIG_${key}=.*/d" \
              -e "/^[[:space:]]*# CONFIG_${key} is not set$/d" \
              "${DEFCONFIG}"
          }

          set_config() {
            local key="$1"
            local value="$2"

            remove_config "${key}"

            printf 'CONFIG_%s=%s\n' \
              "${key}" \
              "${value}" \
              >> "${DEFCONFIG}"
          }

          disable_config() {
            local key="$1"

            remove_config "${key}"

            printf '# CONFIG_%s is not set\n' \
              "${key}" \
              >> "${DEFCONFIG}"
          }

          # --------------------------------------------------------
          # Remove legacy conflict settings.
          # --------------------------------------------------------
          remove_config KSU
          remove_config KSU_MANUAL_HOOK
          remove_config KSU_KPROBES_HOOK
          remove_config KSU_SYSCALL_TABLE_HOOK

          remove_config KSU_SUSFS
          remove_config KSU_SUSFS_SUS_PATH
          remove_config KSU_SUSFS_SUS_MOUNT
          remove_config KSU_SUSFS_SUS_KSTAT
          remove_config KSU_SUSFS_TRY_UMOUNT
          remove_config KSU_SUSFS_SPOOF_UNAME
          remove_config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          remove_config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          remove_config KSU_SUSFS_OPEN_REDIRECT
          remove_config KSU_SUSFS_SUS_MAP
          remove_config KSU_SUSFS_SUS_MEMFD
          remove_config KSU_SUSFS_ENABLE_LOG

          remove_config OVERLAY_FS
          remove_config NOMOUNT

          remove_config TCP_CONG_ADVANCED
          remove_config TCP_CONG_BBR
          remove_config DEFAULT_TCP_CONG

          # --------------------------------------------------------
          # KernelSU
          # --------------------------------------------------------
          set_config KSU y

          # Linux 4.14 uses manual hooks.
          set_config KSU_MANUAL_HOOK y

          disable_config KSU_KPROBES_HOOK
          disable_config KSU_SYSCALL_TABLE_HOOK

          # --------------------------------------------------------
          # SUSFS
          # --------------------------------------------------------
          set_config KSU_SUSFS y

          set_config KSU_SUSFS_SUS_PATH y
          set_config KSU_SUSFS_SUS_MOUNT y
          set_config KSU_SUSFS_SUS_KSTAT y
          set_config KSU_SUSFS_TRY_UMOUNT y

          set_config KSU_SUSFS_SPOOF_UNAME y
          set_config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG y
          set_config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS y

          set_config KSU_SUSFS_OPEN_REDIRECT y
          set_config KSU_SUSFS_SUS_MAP y

          # Experimental feature - keep disabled.
          disable_config KSU_SUSFS_SUS_MEMFD

          # Disable kernel-side SUSFS logging for release build.
          disable_config KSU_SUSFS_ENABLE_LOG

          # --------------------------------------------------------
          # OverlayFS
          # --------------------------------------------------------
          set_config OVERLAY_FS y

          # --------------------------------------------------------
          # NoMount
          # --------------------------------------------------------
          set_config NOMOUNT y

          # --------------------------------------------------------
          # BBR
          # --------------------------------------------------------
          set_config TCP_CONG_ADVANCED y
          set_config TCP_CONG_BBR y
          set_config DEFAULT_TCP_CONG '"bbr"'

          echo
          echo "=================================================="
          echo "Requested sunfish configuration"
          echo "=================================================="

          grep -E \
            '^(CONFIG_(KSU|KSU_MANUAL_HOOK|KSU_KPROBES_HOOK|KSU_SYSCALL_TABLE_HOOK|KSU_SUSFS|KSU_SUSFS_SUS_PATH|KSU_SUSFS_SUS_MOUNT|KSU_SUSFS_SUS_KSTAT|KSU_SUSFS_TRY_UMOUNT|KSU_SUSFS_SPOOF_UNAME|KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG|KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS|KSU_SUSFS_OPEN_REDIRECT|KSU_SUSFS_SUS_MAP|KSU_SUSFS_SUS_MEMFD|KSU_SUSFS_ENABLE_LOG|OVERLAY_FS|NOMOUNT|TCP_CONG_ADVANCED|TCP_CONG_BBR|DEFAULT_TCP_CONG))|# CONFIG_(KSU_KPROBES_HOOK|KSU_SYSCALL_TABLE_HOOK|KSU_SUSFS_SUS_MEMFD|KSU_SUSFS_ENABLE_LOG) is not set' \
            "${DEFCONFIG}" || true


      # ============================================================
      # 10. Do NOT globally modify Google's build infrastructure.
      #
      # Create a local build.config derived from the real Sunfish
      # build config.
      # ============================================================
      - name: Sunfish custom build config 생성

        shell: bash

        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}/kernel_workspace/private/msm-google"

          cp \
            build.config.sunfish \
            build.config.sunfish.custom

          cat >> build.config.sunfish.custom <<'EOF'

          # ========================================================
          # Pixel 4a custom KernelSU-Next/SUSFS/NoMount build
          # ========================================================

          # Disable post-defconfig validation command.
          POST_DEFCONFIG_CMDS=""

          # Skip Android build system defconfig equality check.
          SKIP_DEFCONFIG_CHECK=1
          EOF

          echo
          echo "===== build.config.sunfish.custom ====="
          cat build.config.sunfish.custom


      # ============================================================
      # 11. Build
      # ============================================================
      - name: 커널 빌드

        shell: bash

        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}/kernel_workspace"

          rm -rf out

          export POST_DEFCONFIG_CMDS=""
          export SKIP_DEFCONFIG_CHECK=1

          echo
          echo "=================================================="
          echo "Starting Pixel 4a kernel build"
          echo "=================================================="

          set -o pipefail

          LTO=thin \
          BUILD_CONFIG=private/msm-google/build.config.sunfish.custom \
          ./build/build.sh \
            2>&1 \
            | tee "${GITHUB_WORKSPACE}/kernel-build.log"


      # ============================================================
      # 12. Verify build integrity
      # ============================================================
      - name: 빌드 및 구성 검증

        shell: bash

        run: |
          set -euo pipefail

          KERNEL_ROOT="${GITHUB_WORKSPACE}/kernel_workspace/private/msm-google"

          BUILD_LOG="${GITHUB_WORKSPACE}/kernel-build.log"

          cd "${KERNEL_ROOT}"

          echo
          echo "=================================================="
          echo "Checking KernelSU version detection"
          echo "=================================================="

          if grep -Eq \
              'KSU_GIT_VERSION not defined|KSU_VERSION_TAG not defined|KernelSU-Next version fallback|KernelSU-Next tag fallback' \
              "${BUILD_LOG}"; then

            echo
            echo "ERROR: KernelSU-Next Git metadata fallback detected."
            echo
            grep -E \
              'KSU_GIT_VERSION|KSU_VERSION_TAG|version fallback|tag fallback' \
              "${BUILD_LOG}" || true

            exit 1

          fi

          echo "KernelSU-Next Git metadata OK."


          # --------------------------------------------------------
          # Locate final .config
          # --------------------------------------------------------
          CONFIG_FILE="$(
            find \
              "${GITHUB_WORKSPACE}/kernel_workspace/out" \
              -type f \
              -path "*/private/msm-google/.config" \
              | head -n 1
          )"

          if [ -z "${CONFIG_FILE}" ]; then

            echo "ERROR: final .config not found."

            find \
              "${GITHUB_WORKSPACE}/kernel_workspace/out" \
              -maxdepth 8 \
              -type f \
              | sort \
              | tail -200

            exit 1

          fi

          echo
          echo "Final config:"
          echo "${CONFIG_FILE}"


          required_yes() {
            local key="$1"

            if ! grep -q "^${key}=y$" "${CONFIG_FILE}"; then

              echo
              echo "ERROR: ${key}=y is required."

              grep \
                -E \
                "^${key}=|^# ${key} is not set" \
                "${CONFIG_FILE}" || true

              exit 1

            fi
          }


          required_not_y() {
            local key="$1"

            if grep -q "^${key}=y$" "${CONFIG_FILE}"; then

              echo
              echo "ERROR: ${key}=y must NOT be enabled."

              exit 1

            fi
          }


          required_yes CONFIG_KSU
          required_yes CONFIG_KSU_MANUAL_HOOK

          required_not_y CONFIG_KSU_KPROBES_HOOK
          required_not_y CONFIG_KSU_SYSCALL_TABLE_HOOK

          required_yes CONFIG_KSU_SUSFS
          required_yes CONFIG_KSU_SUSFS_SUS_PATH
          required_yes CONFIG_KSU_SUSFS_SUS_MOUNT
          required_yes CONFIG_KSU_SUSFS_SUS_KSTAT
          required_yes CONFIG_KSU_SUSFS_TRY_UMOUNT
          required_yes CONFIG_KSU_SUSFS_SPOOF_UNAME
          required_yes CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          required_yes CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          required_yes CONFIG_KSU_SUSFS_OPEN_REDIRECT
          required_yes CONFIG_KSU_SUSFS_SUS_MAP

          required_yes CONFIG_OVERLAY_FS
          required_yes CONFIG_NOMOUNT

          required_yes CONFIG_TCP_CONG_ADVANCED
          required_yes CONFIG_TCP_CONG_BBR

          grep -q \
            '^CONFIG_DEFAULT_TCP_CONG="bbr"$' \
            "${CONFIG_FILE}" || {

            echo "ERROR: BBR is not default TCP congestion control."
            exit 1

          }


          # --------------------------------------------------------
          # Manual hook source verification
          # --------------------------------------------------------
          grep -q \
            'ksu_handle_sys_reboot' \
            kernel/reboot.c

          grep -q \
            'ksu_handle_execveat' \
            fs/exec.c

          grep -q \
            'ksu_handle_vfs_read' \
            fs/read_write.c


          # --------------------------------------------------------
          # KernelSU source verification
          # --------------------------------------------------------
          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kbuild
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/app_profile.h
          test -f drivers/kernelsu/uapi/app_profile.h


          # --------------------------------------------------------
          # SUSFS verification
          # --------------------------------------------------------
          test -f fs/susfs.c
          test -f include/linux/susfs.h

          grep -Fq \
            'obj-$(CONFIG_KSU_SUSFS) += susfs.o' \
            fs/Makefile


          # --------------------------------------------------------
          # NoMount verification
          # --------------------------------------------------------
          test -f fs/nomount/Kconfig
          test -d fs/nomount

          grep -Fq \
            'source "fs/nomount/Kconfig"' \
            fs/Kconfig

          grep -Fq \
            'obj-$(CONFIG_NOMOUNT) += nomount/' \
            fs/Makefile


          # --------------------------------------------------------
          # Kernel image
          # --------------------------------------------------------
          IMAGE="$(
            find \
              "${GITHUB_WORKSPACE}/kernel_workspace/out" \
              -type f \
              -name "Image.lz4-dtb" \
              | sort \
              | head -n 1
          )"

          if [ -z "${IMAGE}" ]; then

            echo
            echo "ERROR: Image.lz4-dtb not found."

            find \
              "${GITHUB_WORKSPACE}/kernel_workspace/out" \
              -type f \
              | sort \
              | grep -E \
                '/(Image|Image\..*|vmlinux|System\.map)$' \
              | tail -100 || true

            exit 1

          fi


          # --------------------------------------------------------
          # Detect KSU version/tag from build log
          # --------------------------------------------------------
          KSU_VERSION_LINE="$(
            grep -E \
              -- '-- KernelSU-Next version:' \
              "${BUILD_LOG}" \
              | tail -n 1 \
              || true
          )"

          KSU_TAG_LINE="$(
            grep -E \
              -- '-- KernelSU-Next tag:' \
              "${BUILD_LOG}" \
              | tail -n 1 \
              || true
          )"

          echo
          echo "KSU:"
          echo "${KSU_VERSION_LINE}"

          echo "KSU tag:"
          echo "${KSU_TAG_LINE}"


          # --------------------------------------------------------
          # Export build metadata
          # --------------------------------------------------------
          {
            echo "DEVICE=Pixel 4a"
            echo "CODENAME=sunfish"
            echo "KERNEL_BRANCH=android-msm-sunfish-4.14-android13"
            echo "KERNEL_VERSION=$(make -s kernelversion)"
            echo "KSUN_REPO=${{ inputs.ksun_repo }}"
            echo "KSUN_REF=${{ inputs.ksun_ref }}"
            echo "KSUN_COMMIT=${KSUN_COMMIT:-unknown}"
            echo "KSUN_TAG=${KSUN_TAG:-unknown}"
            echo "SUSFS_REPO=${{ inputs.susfs_repo }}"
            echo "SUSFS_REF=${{ inputs.susfs_ref }}"
            echo "SUSFS_COMMIT=${SUSFS_COMMIT:-unknown}"
            echo "NOMOUNT_REPO=${{ inputs.nomount_repo }}"
            echo "NOMOUNT_REF=${{ inputs.nomount_ref }}"
            echo "NOMOUNT_COMMIT=${NOMOUNT_COMMIT:-unknown}"
            echo "IMAGE=${IMAGE}"
            echo "BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          } > "${GITHUB_WORKSPACE}/BUILD_INFO.txt"


          sha256sum \
            "${IMAGE}" \
            > "${GITHUB_WORKSPACE}/KERNEL_SHA256SUM.txt"


          echo
          echo "=================================================="
          echo "BUILD VERIFICATION: PASS"
          echo "=================================================="

          echo
          echo "Kernel image:"
          echo "${IMAGE}"

          echo
          sha256sum "${IMAGE}"


      # ============================================================
      # 13. AnyKernel3
      # ============================================================
      - name: AnyKernel3 패키징

        shell: bash

        env:
          AK3_REPO: ${{ inputs.anykernel3_repo }}
          AK3_REF: ${{ inputs.anykernel3_ref }}

        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}"

          rm -rf AnyKernel3

          echo
          echo "=================================================="
          echo "AnyKernel3"
          echo "Repository: ${AK3_REPO}"
          echo "Ref:        ${AK3_REF}"
          echo "=================================================="

          git clone \
            --depth=1 \
            --branch "${AK3_REF}" \
            "${AK3_REPO}" \
            AnyKernel3

          cd AnyKernel3

          AK3_COMMIT="$(git rev-parse HEAD)"

          echo "AnyKernel3 commit:"
          echo "${AK3_COMMIT}"


          # --------------------------------------------------------
          # Locate Pixel 4a kernel image.
          # --------------------------------------------------------
          IMAGE="$(
            find \
              "${GITHUB_WORKSPACE}/kernel_workspace/out" \
              -type f \
              -name "Image.lz4-dtb" \
              | sort \
              | head -n 1
          )"

          if [ -z "${IMAGE}" ]; then

            echo "ERROR: Image.lz4-dtb not found."
            exit 1

          fi


          cp \
            "${IMAGE}" \
            "${GITHUB_WORKSPACE}/AnyKernel3/Image.lz4-dtb"


          # --------------------------------------------------------
          # Device check.
          # --------------------------------------------------------
          if grep -q \
              '^device.name1=' \
              anykernel.sh; then

            sed -i \
              's/^device\.name1=.*/device.name1=sunfish/' \
              anykernel.sh

          else

            printf '\ndevice.name1=sunfish\n' \
              >> anykernel.sh

          fi


          # --------------------------------------------------------
          # Build information
          # --------------------------------------------------------
          cp \
            "${GITHUB_WORKSPACE}/BUILD_INFO.txt" \
            BUILD_INFO.txt

          cp \
            "${GITHUB_WORKSPACE}/KERNEL_SHA256SUM.txt" \
            KERNEL_SHA256SUM.txt

          echo "ANYKERNEL3_COMMIT=${AK3_COMMIT}" \
            >> BUILD_INFO.txt


          # --------------------------------------------------------
          # Ensure actual kernel image is included.
          # --------------------------------------------------------
          test -f Image.lz4-dtb


          # --------------------------------------------------------
          # Create flashable ZIP.
          # --------------------------------------------------------
          cd "${GITHUB_WORKSPACE}/AnyKernel3"

          rm -f \
            "${GITHUB_WORKSPACE}/Sunfish-KernelSU-Next-SUSFS-NoMount-BBR.zip"

          zip \
            -r9 \
            "${GITHUB_WORKSPACE}/Sunfish-KernelSU-Next-SUSFS-NoMount-BBR.zip" \
            . \
            -x ".git/*" \
            -x "README.md"


      # ============================================================
      # 14. Upload final kernel
      # ============================================================
      - name: 완제품 업로드

        uses: actions/upload-artifact@v4

        with:
          name: Sunfish-KernelSU-Next-SUSFS-NoMount-BBR

          path: |
            Sunfish-KernelSU-Next-SUSFS-NoMount-BBR.zip

          if-no-files-found: error

          retention-days: 30


      # ============================================================
      # 15. Upload diagnostics
      # ============================================================
      - name: 빌드 로그 및 검증정보 업로드

        uses: actions/upload-artifact@v4

        with:
          name: Sunfish-Kernel-Build-Diagnostics

          path: |
            kernel-build.log
            BUILD_INFO.txt
            KERNEL_SHA256SUM.txt

          if-no-files-found: error

          retention-days: 30
