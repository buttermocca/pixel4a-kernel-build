name: Build Pixel 4a Sunfish Kernel (KernelSU-Next + SUSFS + NoMount + BBR)

# ============================================================================
# 대상: Google Pixel 4a (sunfish), TQ3A.230805.001.S1 (Android 13, 순정 커널
#       4.14.302-g6ff6ddc33f7d)
#
# 이 워크플로가 만드는 것:
#   - AOSP msm-google 4.14 (sunfish) 순정 소스
#   - KernelSU-Next (legacy-susfs-v2 계열, 커밋 고정)
#   - SUSFS 4.14 v2.2.1 (KernelSU-Next legacy-susfs-v2 API와 짝이 맞는 포팅본)
#   - NoMount (내장)
#   - BBR (기본 TCP 혼잡 제어)
#   - AnyKernel3 플래셔블 zip
#
# ----------------------------------------------------------------------------
# 이전 버전에서 실제로 실패했던 원인 (logs_98353932107.zip 분석 결과)
# ----------------------------------------------------------------------------
# [치명] 8단계(SUSFS 통합)에서 즉시 중단:
#     Cloning into 'SUSFS'...
#     fatal: '--detach' cannot be used with '-b/-B/--orphan'
#     Process completed with exit code 128.
#
#   원인: `git clone <repo> SUSFS` 직후에는 `kernel-4.14` 라는 "원격 브랜치"만
#   있고 로컬 브랜치는 없다. 이 상태에서 `git checkout --detach kernel-4.14`
#   를 실행하면 git의 DWIM이 "로컬 브랜치 커널-4.14를 만들어 추적하게 한다"는
#   동작(= -b)을 끼워 넣는데, --detach와 -b는 동시에 쓸 수 없어 즉시 죽는다.
#   (SHA를 넣으면 -b가 필요 없으므로 통과한다. 그래서 KSUN 단계는 우연히
#    성공하고 SUSFS 단계만 죽었다.)
#   해결: ref를 먼저 "커밋 SHA로 확정"한 뒤 --detach 한다.
#   아래 resolve_ref() 함수가 그 역할을 하며, 브랜치/태그/짧은 SHA 모두 지원한다.
#
# [치명] 그 다음에 기다리고 있던 진짜 문제: SUSFS API 불일치
#   이 워크플로가 받아오던 SUSFS는 simonpunk/susfs4ksu의 kernel-4.14
#   브랜치인데, 이 브랜치는 2025-02-23(v1.5.5) 이후 갱신이 없고 API가
#   "struct st_susfs_* __user" 형태의 v1.x 계열이다.
#   반면 KSUN legacy-susfs-v2(v3.4.0)는 v2.x API를 호출한다.
#   실제로 두 트리를 대조하면 KSUN이 호출하는 34개 심볼 중 20개가
#   공식 kernel-4.14 트리에 아예 존재하지 않는다
#   (susfs_set_current_proc_umounted, susfs_is_current_proc_umounted,
#    susfs_run_sus_path_loop, susfs_show_version, susfs_get_enabled_features,
#    susfs_set_avc_log_spoofing ... ).
#   게다가 기존 워크플로의 "ABI FIX" 스텁은 타입 충돌까지 유발한다:
#   KSUN은 `extern struct work_struct susfs_extra_works;` 로 "변수"를
#   선언하고 `schedule_work(&susfs_extra_works)` 로 쓰는데, 스텁은 같은
#   이름을 `void susfs_extra_works(void) {}` 라는 "함수"로 정의한다.
#   → 선언 불일치 컴파일 에러. 즉 스텁으로는 절대 통과할 수 없다.
#   해결: API가 실증적으로 맞는 4.14용 SUSFS v2.2.1 포팅 패치를 사용한다.
#   (저장소에 동봉한 susfs-4.14-v2.2.1.patch / 없으면 자동 생성)
#
# [수정] ABI 사전검사(9단계)가 사실상 항상 실패하던 문제
#   기존 구현은 `--exclude-dir=kernelsu` 로 KSUN 자기 트리를 통째로 제외한 뒤
#   나머지 커널에서만 심볼을 찾았다. 그런데 SUSFS가 KSUN과 공유하는 SID 관련
#   헬퍼(susfs_is_sid_equal, susfs_get_current_sid, susfs_set_zygote_sid,
#   susfs_set_ksu_sid, susfs_set_init_sid, susfs_set_priv_app_sid ...)는
#   정의 위치가 바로 그 제외된 `drivers/kernelsu/selinux/selinux.c` 다.
#   → 정상적으로 통합된 트리에서도 "누락"으로 오탐되어 빌드를 막는다.
#   해결: 자기 트리에서 정의된 심볼을 먼저 인정하고, 실제로 외부(SUSFS)가
#   제공해야 하는 심볼만 검사한다.
#
# [수정] 커널 소스 브랜치
#   기존 기본값 android-msm-sunfish-4.14-android13 은 4.14.276 이다.
#   TQ3A.230805.001.S1 순정(4.14.302-g6ff6ddc33f7d)과 맞추려면
#   android-msm-sunfish-4.14-android13-qpr3 를 써야 한다(기본값 변경).
#
# [수정] defconfig 검증
#   기존 구현은 Kconfig에 존재하지 않는 심볼까지 defconfig에 밀어 넣고
#   그 결과를 검증했다. 이제 KSUN Kconfig에 실제로 있는 키만 적용하고,
#   결과 .config 검증도 Kconfig에서 키를 읽어 자동 생성한다.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: >-
          AOSP manifest 브랜치. TQ3A.230805.001.S1 순정(4.14.302)과 맞추려면
          android-msm-sunfish-4.14-android13-qpr3.
        required: false
        default: android-msm-sunfish-4.14-android13-qpr3

      ksun_repo:
        description: KernelSU-Next 저장소 URL
        required: false
        default: https://github.com/sidex15/KernelSU-Next.git
      ksun_ref:
        description: >-
          KernelSU-Next 커밋 SHA/태그/브랜치. 기본값은 legacy-susfs-v2 계열의
          v3.4.0-legacy-susfs-v2 태그 커밋(= 최신 legacy 트리).
          SUSFS 포트가 실제로 컴파일 검증된 조합은
          https://github.com/i928/KSU-Next.git @
          f8e16580ee08f9eb1666e51f13a75bf5b7f5053f 이다.
          (두 커밋이 호출하는 susfs_* 심볼 집합은 동일함을 확인했다.)
        required: false
        default: d999a2aff11575c6e2f520129ecffb7c6058fb02
      ksu_version_tag:
        description: 커널에 새길 KSU_VERSION_TAG 문자열
        required: false
        default: v3.4.0-legacy-susfs-v2
      ksu_version_override:
        description: >-
          (선택) KSU_VERSION 숫자 강제 지정. 비워두면 Kbuild가 커밋 수로
          자동 계산한다. Manager가 "unsupported version"을 띄우면
          Manager가 요구하는 versionCode 값을 넣어 재빌드할 것.
        required: false
        default: ""

      susfs_patch_url:
        description: >-
          (선택) SUSFS 4.14 v2.2.1 패치를 직접 지정할 때의 URL.
          비워두면 저장소의 .github/patches/susfs-4.14-v2.2.1.patch 를 쓰고,
          그것도 없으면 유지보수 트리에서 자동 생성한다.
        required: false
        default: ""
      susfs_base:
        description: SUSFS 자동 생성 시 기준 커밋(이 커밋 이후의 변경분을 뽑는다)
        required: false
        default: 6e1dbe34f3f1fec5205820865a61d9a8cc123985
      susfs_tip:
        description: SUSFS 자동 생성 시 대상 커밋(sunfish-susfs-v2.2.1 계열)
        required: false
        default: cd27fc627509c15221877bec19cb7d9b9b00188c

      nomount_repo:
        description: NoMount 저장소 URL
        required: false
        default: https://github.com/maxsteeel/nomount.git
      nomount_ref:
        description: NoMount 브랜치/태그/커밋
        required: false
        default: master
      anykernel3_repo:
        description: AnyKernel3 저장소 URL
        required: false
        default: https://github.com/osm0sis/AnyKernel3.git
      anykernel3_ref:
        description: AnyKernel3 브랜치/태그/커밋
        required: false
        default: master

permissions:
  contents: read

env:
  KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'android-msm-sunfish-4.14-android13-qpr3' }}

  KSUN_REPO: ${{ github.event.inputs.ksun_repo || 'https://github.com/sidex15/KernelSU-Next.git' }}
  KSUN_REF: ${{ github.event.inputs.ksun_ref || 'd999a2aff11575c6e2f520129ecffb7c6058fb02' }}
  KSU_VERSION_TAG: ${{ github.event.inputs.ksu_version_tag || 'v3.4.0-legacy-susfs-v2' }}
  KSU_VERSION_OVERRIDE: ${{ github.event.inputs.ksu_version_override || '' }}

  SUSFS_PATCH_URL: ${{ github.event.inputs.susfs_patch_url || '' }}
  SUSFS_BASE: ${{ github.event.inputs.susfs_base || '6e1dbe34f3f1fec5205820865a61d9a8cc123985' }}
  SUSFS_TIP: ${{ github.event.inputs.susfs_tip || 'cd27fc627509c15221877bec19cb7d9b9b00188c' }}
  SUSFS_TIP_REPO: https://github.com/i928/kernel_google_msm-4.14.git

  NOMOUNT_REPO: ${{ github.event.inputs.nomount_repo || 'https://github.com/maxsteeel/nomount.git' }}
  NOMOUNT_REF: ${{ github.event.inputs.nomount_ref || 'master' }}

  ANYKERNEL3_REPO: ${{ github.event.inputs.anykernel3_repo || 'https://github.com/osm0sis/AnyKernel3.git' }}
  ANYKERNEL3_REF: ${{ github.event.inputs.anykernel3_ref || 'master' }}

  KROOT_NAME: private/msm-google

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 저장 공간 확장
        uses: easimon/maximize-build-space@v8
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: true
          remove-android: true
          remove-haskell: true

      - name: 필수 패키지 설치 및 Git 환경 설정
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            curl \
            device-tree-compiler \
            flex \
            git \
            libdw-dev \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            libsqlite3-dev \
            lz4 \
            patch \
            pkg-config \
            python3 \
            python-is-python3 \
            rsync \
            unzip \
            zip

          # repo/submodule이 다른 소유자로 체크아웃돼도 git이 거부하지 않게 한다.
          git config --global --add safe.directory "*"

          gcc --version | head -n 1
          clang --version | head -n 1
          git --version
          python3 --version

      - name: Repo 설치
        shell: bash
        run: |
          set -euo pipefail

          REPO_DIR="${HOME}/bin"
          mkdir -p "${REPO_DIR}"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${REPO_DIR}/repo"

          chmod 0755 "${REPO_DIR}/repo"
          echo "${REPO_DIR}" >> "${GITHUB_PATH}"
          export PATH="${REPO_DIR}:${PATH}"

          command -v repo
          repo --version

      - name: Pixel 4a Sunfish 커널 소스 다운로드
        shell: bash
        run: |
          set -euo pipefail

          export PATH="${HOME}/bin:${PATH}"

          rm -rf "${GITHUB_WORKSPACE}/kernel_workspace"
          mkdir -p "${GITHUB_WORKSPACE}/kernel_workspace"
          cd "${GITHUB_WORKSPACE}/kernel_workspace"

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "${KERNEL_BRANCH}" \
            --depth=1

          repo sync \
            -c \
            -j2 \
            --no-tags \
            --no-clone-bundle

          cd "${KROOT_NAME}"

          # 순정 커널과 같은 계열인지 확인한다.
          # (TQ3A.230805.001.S1 순정: 4.14.302-g6ff6ddc33f7d)
          KERNEL_VERSION="$(make -s kernelversion)"
          echo "Kernel version: ${KERNEL_VERSION}"
          echo "KERNEL_VERSION=${KERNEL_VERSION}" >> "${GITHUB_ENV}"

          case "${KERNEL_VERSION}" in
            4.14.*)
              echo "Pixel 4a Linux 4.14 kernel confirmed."
              ;;
            *)
              echo "ERROR: Expected Linux 4.14, got ${KERNEL_VERSION}"
              exit 1
              ;;
          esac

      - name: KernelSU-Next 통합
        shell: bash
        run: |
          set -euo pipefail

          KROOT="${GITHUB_WORKSPACE}/kernel_workspace/${KROOT_NAME}"
          cd "${KROOT}"

          # ------------------------------------------------------------------
          # 브랜치/태그/짧은SHA를 "확정된 커밋 SHA"로 바꿔주는 헬퍼.
          # 예전 코드의 `git checkout --detach <브랜치명>` 은 git DWIM이
          # -b 를 끼워 넣어 즉시 fatal 로 죽는다(이번 실패의 직접 원인).
          # ------------------------------------------------------------------
          resolve_ref() {
            local repo_dir="$1"
            local ref="$2"
            local out
            if out="$(git -C "${repo_dir}" rev-parse --verify "refs/remotes/origin/${ref}^{commit}" 2>/dev/null)"; then
              echo "${out}"; return 0
            fi
            if out="$(git -C "${repo_dir}" rev-parse --verify "refs/tags/${ref}^{commit}" 2>/dev/null)"; then
              echo "${out}"; return 0
            fi
            if out="$(git -C "${repo_dir}" rev-parse --verify "${ref}^{commit}" 2>/dev/null)"; then
              echo "${out}"; return 0
            fi
            echo "ERROR: ref '${ref}' 를 ${repo_dir} 에서 확인할 수 없습니다." >&2
            return 1
          }

          rm -rf drivers/kernelsu KernelSU-Next

          echo "KernelSU-Next repository: ${KSUN_REPO}"
          echo "KernelSU-Next ref:        ${KSUN_REF}"

          # --filter=blob:none: 커밋 히스토리는 전부 받아온다.
          # 이게 중요하다. KSUN Kbuild는 커밋 수(rev-list --count)로
          # KSU_VERSION을 계산하기 때문에 shallow clone이면 버전이 깨진다.
          git clone --filter=blob:none "${KSUN_REPO}" KernelSU-Next

          KSUN_COMMIT="$(resolve_ref KernelSU-Next "${KSUN_REF}")"
          git -C KernelSU-Next checkout --detach "${KSUN_COMMIT}"

          KSUN_COMMIT_DATE="$(git -C KernelSU-Next show -s --format=%ci HEAD)"
          echo "KernelSU-Next HEAD:        ${KSUN_COMMIT}"
          echo "KernelSU-Next commit date: ${KSUN_COMMIT_DATE}"

          echo "KSUN_COMMIT=${KSUN_COMMIT}" >> "${GITHUB_ENV}"
          echo "${KSUN_COMMIT_DATE}" > "${GITHUB_WORKSPACE}/ksun_commit_date.txt"
          echo "${KSUN_COMMIT}"      > "${GITHUB_WORKSPACE}/ksun_commit.txt"

          # 소스 레이아웃 검증 (legacy-susfs-v2 트리 = kernel/ 하위 구조)
          test -f KernelSU-Next/kernel/Kbuild
          test -f KernelSU-Next/kernel/Kconfig
          test -f KernelSU-Next/kernel/core/init.c
          test -f KernelSU-Next/kernel/policy/allowlist.h
          test -f KernelSU-Next/kernel/policy/app_profile.h
          test -f KernelSU-Next/uapi/app_profile.h

          grep -Fq 'config KSU_MANUAL_HOOK' KernelSU-Next/kernel/Kconfig
          grep -Fq 'config KSU_SUSFS'      KernelSU-Next/kernel/Kconfig

          # Kbuild에 파이썬 패처가 남아 있으면 여기서 명시적으로 실패시킨다.
          # (예전 워크플로는 .py를 전부 무력화하고 Kbuild를 주석 처리했는데,
          #  이 트리에는 애초에 파이썬 호출이 없다. 조용히 갈아엎는 대신
          #  전제가 깨졌다면 그대로 알려주는 편이 안전하다.)
          if grep -qE '(^|[^A-Za-z0-9_])python[0-9.]*([^A-Za-z0-9_]|$)|\.py([^A-Za-z0-9_]|$)' KernelSU-Next/kernel/Kbuild; then
            echo "ERROR: KernelSU-Next Kbuild에 파이썬 호출이 남아 있습니다."
            echo "       이 워크플로는 파이썬 패처가 없는 트리를 전제로 합니다."
            grep -nE '(^|[^A-Za-z0-9_])python[0-9.]*([^A-Za-z0-9_]|$)|\.py([^A-Za-z0-9_]|$)' KernelSU-Next/kernel/Kbuild || true
            exit 1
          fi

          # drivers/kernelsu 는 KernelSU-Next/kernel 로의 상대 심볼릭 링크로 둔다.
          # (복사 + .git 삭제 방식은 KSU_VERSION 자동 계산을 망가뜨린다.)
          ln -sfn ../KernelSU-Next/kernel drivers/kernelsu

          test -e drivers/kernelsu/Kbuild
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/uapi/app_profile.h

          # uapi/policy 경로도 KSUN 트리에서 그대로 보이도록 정리한다.
          # (legacy-susfs-v2 는 kernel/uapi 를 그대로 쓰지만, 일부 패치는
          #  drivers/kernelsu/policy/uapi 를 참조하므로 둘 다 보장한다.)
          if [ ! -e drivers/kernelsu/policy/uapi ]; then
            mkdir -p drivers/kernelsu/policy
            ln -sfn ../../uapi drivers/kernelsu/policy/uapi
          fi

          grep -Fqx \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile

          grep -Fqx \
            'source "drivers/kernelsu/Kconfig"' \
            drivers/Kconfig || \
            printf '\nsource "drivers/kernelsu/Kconfig"\n' >> drivers/Kconfig

          echo "KernelSU-Next integration OK."

      - name: KernelSU-Next 4.14 manual hooks 적용
        shell: bash
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}/kernel_workspace/${KROOT_NAME}"

          # 이 단계는 "SUSFS 통합" 다음이 아니라 "전"에 돌 수 있도록
          # 심볼 존재 여부를 항상 확인하고, 이미 있으면 건너뛴다(idempotent).
          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          ROOT = Path(".")

          def add_after_includes(path: Path, block: str) -> None:
              text = path.read_text()
              if "ksu_handle_" in text:
                  return
              matches = list(re.finditer(r"^#include[^\n]*$", text, re.MULTILINE))
              if not matches:
                  print(f"[ERROR] include block not found: {path}")
                  sys.exit(1)
              pos = matches[-1].end()
              path.write_text(text[:pos] + "\n" + block + text[pos:])

          def insert_before_anchor(path, function_pattern, anchor_pattern, block, symbol):
              text = path.read_text()
              if symbol in text:
                  print(f"[OK] {path}: {symbol} already present")
                  return
              fn = re.search(function_pattern, text, re.MULTILINE | re.DOTALL)
              if not fn:
                  print(f"[ERROR] function not found: {path}")
                  sys.exit(1)
              tail = text[fn.end():]
              anchor = re.search(anchor_pattern, tail, re.MULTILINE | re.DOTALL)
              if not anchor:
                  print(f"[ERROR] anchor not found for {symbol}: {path}")
                  sys.exit(1)
              pos = fn.end() + anchor.start()
              path.write_text(text[:pos] + block + "\n" + text[pos:])
              if symbol not in path.read_text():
                  print(f"[ERROR] insertion verification failed: {path}: {symbol}")
                  sys.exit(1)
              print(f"[PATCH] {path}: {symbol}")

          # fs/exec.c ------------------------------------------------------
          exec_decl = r'''
          #ifdef CONFIG_KSU
          extern int ksu_handle_execveat(
              int *fd,
              struct filename **filename_ptr,
              void *argv,
              void *envp,
              int *flags);
          #endif
          '''

          exec_block = r'''
          #ifdef CONFIG_KSU
              ksu_handle_execveat(
                  (int *)AT_FDCWD,
                  &filename,
                  &argv,
                  &envp,
                  0);
          #endif
          '''

          exec_path = ROOT / "fs/exec.c"
          add_after_includes(exec_path, exec_decl)

          text = exec_path.read_text()
          for name in ("do_execve", "compat_do_execve"):
              fn = re.search(
                  rf"(?m)^[^\n]*\b{name}\s*\([^;]*\)\s*\{{",
                  text, re.MULTILINE | re.DOTALL,
              )
              if not fn:
                  print(f"[ERROR] {name}() not found in fs/exec.c")
                  sys.exit(1)
              tail = text[fn.end():]
              anchor = re.search(r"return\s+do_execveat_common\s*\(", tail, re.MULTILINE)
              if not anchor:
                  print(f"[ERROR] do_execveat_common() call not found inside {name}()")
                  sys.exit(1)
              section = tail[:anchor.start()]
              if "ksu_handle_execveat(" not in section:
                  pos = fn.end() + anchor.start()
                  text = text[:pos] + exec_block + "\n" + text[pos:]
          exec_path.write_text(text)

          # fs/open.c ------------------------------------------------------
          open_decl = r'''
          #ifdef CONFIG_KSU
          extern int ksu_handle_faccessat(
              int *dfd,
              const char __user **filename_user,
              int *mode,
              int *flags);
          #endif
          '''
          open_block = r'''
          #ifdef CONFIG_KSU
              ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          #endif
          '''
          open_path = ROOT / "fs/open.c"
          add_after_includes(open_path, open_decl)
          insert_before_anchor(
              open_path,
              r"SYSCALL_DEFINE3\s*\(\s*faccessat\b",
              r"if\s*\(mode\s*&\s*~S_IRWXO\)",
              open_block,
              "ksu_handle_faccessat(",
          )

          # fs/read_write.c ------------------------------------------------
          read_decl = r'''
          #ifdef CONFIG_KSU
          extern bool ksu_vfs_read_hook __read_mostly;
          extern __attribute__((cold)) int ksu_handle_sys_read(
              unsigned int fd,
              char __user **buf_ptr,
              size_t *count_ptr);
          #endif
          '''
          read_block = r'''
          #ifdef CONFIG_KSU
              if (unlikely(ksu_vfs_read_hook))
                  ksu_handle_sys_read(fd, &buf, &count);
          #endif
          '''
          read_path = ROOT / "fs/read_write.c"
          add_after_includes(read_path, read_decl)
          insert_before_anchor(
              read_path,
              r"SYSCALL_DEFINE3\s*\(\s*read\b",
              r"if\s*\(f\.file\)",
              read_block,
              "ksu_handle_sys_read(",
          )

          # fs/stat.c ------------------------------------------------------
          stat_decl = r'''
          #ifdef CONFIG_KSU
          extern int ksu_handle_stat(
              int *dfd,
              const char __user **filename_user,
              int *flags);
          #endif
          '''
          stat_block = r'''
          #ifdef CONFIG_KSU
              ksu_handle_stat(&dfd, &filename, &flag);
          #endif
          '''
          stat_path = ROOT / "fs/stat.c"
          add_after_includes(stat_path, stat_decl)
          insert_before_anchor(
              stat_path,
              r"SYSCALL_DEFINE4\s*\(\s*newfstatat\b",
              r"error\s*=\s*vfs_fstatat",
              stat_block,
              "ksu_handle_stat(",
          )

          # kernel/reboot.c ------------------------------------------------
          reboot_decl = r'''
          #ifdef CONFIG_KSU
          extern int ksu_handle_sys_reboot(
              int magic1,
              int magic2,
              unsigned int cmd,
              void __user **arg);
          #endif
          '''
          reboot_block = r'''
          #ifdef CONFIG_KSU
              ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
          #endif
          '''
          reboot_path = ROOT / "kernel/reboot.c"
          add_after_includes(reboot_path, reboot_decl)
          insert_before_anchor(
              reboot_path,
              r"SYSCALL_DEFINE4\s*\(\s*reboot\b",
              r"/\*\s*We only trust the superuser with rebooting",
              reboot_block,
              "ksu_handle_sys_reboot(",
          )

          required = {
              "fs/exec.c": ["ksu_handle_execveat("],
              "fs/open.c": ["ksu_handle_faccessat("],
              "fs/read_write.c": ["ksu_handle_sys_read("],
              "fs/stat.c": ["ksu_handle_stat("],
              "kernel/reboot.c": ["ksu_handle_sys_reboot("],
          }
          for filename, symbols in required.items():
              text = (ROOT / filename).read_text()
              for symbol in symbols:
                  if symbol not in text:
                      print(f"[ERROR] Manual hook missing: {filename}: {symbol}")
                      sys.exit(1)

          print("KernelSU-Next manual hook integration OK.")
          PY

      - name: SUSFS 4.14 (KernelSU-Next legacy-susfs-v2 호환 포트) 통합
        shell: bash
        run: |
          set -euo pipefail

          KROOT="${GITHUB_WORKSPACE}/kernel_workspace/${KROOT_NAME}"
          PATCH_LOCAL="${GITHUB_WORKSPACE}/.github/patches/susfs-4.14-v2.2.1.patch"
          PATCH_WORK="${GITHUB_WORKSPACE}/susfs-4.14-v2.2.1.patch"

          # 1) 어떤 패치를 쓸지 결정: URL > 저장소 동봉 > 유지보수 트리에서 생성
          if [ -n "${SUSFS_PATCH_URL}" ]; then
            echo "SUSFS patch source: URL (${SUSFS_PATCH_URL})"
            curl --fail --location --retry 5 --retry-all-errors \
              "${SUSFS_PATCH_URL}" -o "${PATCH_WORK}"
          elif [ -f "${PATCH_LOCAL}" ]; then
            echo "SUSFS patch source: repository file (.github/patches/susfs-4.14-v2.2.1.patch)"
            cp "${PATCH_LOCAL}" "${PATCH_WORK}"
          else
            echo "SUSFS patch source: generated from ${SUSFS_TIP_REPO}"
            rm -rf /tmp/susfs-src
            git clone --filter=blob:none --no-checkout \
              "${SUSFS_TIP_REPO}" /tmp/susfs-src
            git -C /tmp/susfs-src diff \
              "${SUSFS_BASE}..${SUSFS_TIP}" \
              -- \
              'fs/*' \
              'include/linux/*' \
              'kernel/sys.c' \
              'kernel/kallsyms.c' \
              'mm/memory.c' \
              'security/selinux/avc.c' \
              'drivers/input/input.c' \
              > "${PATCH_WORK}" || true

            # exec.c/reboot.c/block_dev.c 는 manual hook 단계 및 exFAT 관련이라
            # 제외한다(중복 삽입/충돌 방지).
            python3 - "${PATCH_WORK}" <<'PY'
          import re, sys, pathlib
          p = pathlib.Path(sys.argv[1])
          src = p.read_text()
          EXCLUDE = {"fs/exec.c", "kernel/reboot.c", "fs/block_dev.c", "include/linux/blkdev.h"}
          keep = []
          for c in re.split(r'(?m)^(?=diff --git )', src):
              m = re.match(r'diff --git a/(\S+) b/(\S+)', c)
              if not m:
                  continue
              if m.group(2) not in EXCLUDE:
                  keep.append(c)
          p.write_text("".join(keep))
          print(f"[SUSFS] patch chunks kept: {len(keep)}")
          PY
          fi

          test -s "${PATCH_WORK}"
          echo "SUSFS patch size: $(wc -c < "${PATCH_WORK}") bytes"

          # 2) 패치 적용
          cd "${KROOT}"

          # `git apply` 는 컨텍스트가 1줄만 달라도 거부한다. sunfish 순정 트리와
          # 유지보수 트리의 라인 오프셋 차이를 흡수해야 하므로 patch(1)의 fuzz를 쓴다.
          patch -p1 --forward --batch -F3 < "${PATCH_WORK}" > "${GITHUB_WORKSPACE}/susfs-patch.log" 2>&1 || true

          echo "---- SUSFS patch log (FAILED 라인) ----"
          grep -n -iE "FAILED|malformed|can't find file" "${GITHUB_WORKSPACE}/susfs-patch.log" || echo "(no failures reported)"

          # 3) 절대 규칙: 거부된 hunk 가 하나라도 있으면 조용히 넘어가지 않는다.
          if find . -name "*.rej" -print -quit | grep -q .; then
            echo "=================================================="
            echo "ERROR: SUSFS 패치가 일부 적용되지 않았습니다 (.rej 존재)"
            echo "=================================================="
            find . -name "*.rej" | while read -r f; do
              echo "----- ${f} -----"
              cat "${f}"
            done
            exit 1
          fi

          # 4) 결과 파일 검증
          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -f include/linux/susfs_def.h

          SUSFS_VERSION="$(grep -E '^#define SUSFS_VERSION' include/linux/susfs.h | cut -d'"' -f2)"
          echo "SUSFS_VERSION: ${SUSFS_VERSION}"
          echo "SUSFS_VERSION=${SUSFS_VERSION}" >> "${GITHUB_ENV}"

          grep -Fq 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile || \
            printf '\nobj-$(CONFIG_KSU_SUSFS) += susfs.o\n' >> fs/Makefile

          grep -Fq 'susfs_task_state' include/linux/sched.h || {
            echo "ERROR: include/linux/sched.h 에 susfs_task_state 필드가 없습니다."
            exit 1
          }

          echo "SUSFS kernel-side integration OK."

      - name: KernelSU-Next / SUSFS ABI 사전검사
        shell: bash
        run: |
          set -euo pipefail

          KROOT="${GITHUB_WORKSPACE}/kernel_workspace/${KROOT_NAME}"
          cd "${KROOT}"

          # ------------------------------------------------------------------
          # 심볼을 두 그룹으로 나눈다.
          #   (A) KSUN 자기 트리에서 정의되는 것 (selinux 헬퍼 등)
          #       -> 예전 구현은 이걸 못 찾아 "누락"으로 오탐했다.
          #   (B) SUSFS가 반드시 제공해야 하는 것
          #       -> 이것만 진짜 검사 대상.
          # ------------------------------------------------------------------
          mapfile -t CALLED_SYMS < <(
            grep -RhoE '\b(susfs|ksu_susfs)_[A-Za-z0-9_]+[[:space:]]*\(' \
              drivers/kernelsu \
              2>/dev/null \
            | sed -E 's/[[:space:]]*\($//' \
            | sort -u
          )

          REAL_MISSING=()
          SELF_OK=()
          IGNORED=()

          for sym in "${CALLED_SYMS[@]:-}"; do
            [ -z "${sym}" ] && continue

            # (A) KSUN 자기 트리(심볼릭 링크 포함)에서 정의/선언되는지 먼저 본다.
            if grep -RqE "^[A-Za-z_].*[^A-Za-z0-9_]${sym}[[:space:]]*\(|extern[^;]*\b${sym}\b|static inline[^;]*\b${sym}\b" \
                 drivers/kernelsu/Kconfig drivers/kernelsu/Kbuild 2>/dev/null; then
              SELF_OK+=("${sym}")
              continue
            fi

            # (B) 커널 나머지 + KSUN 트리 전체에서 실제 정의를 찾는다.
            if grep -qE "^[A-Za-z_].*[^A-Za-z0-9_]${sym}[[:space:]]*\(" \
                 --include='*.c' --include='*.h' -r \
                 drivers/kernelsu fs include/linux kernel security mm net drivers 2>/dev/null; then
              SELF_OK+=("${sym}")
            elif grep -qE "\b${sym}\b" \
                 --include='*.c' --include='*.h' -r \
                 fs include/linux kernel security mm net drivers 2>/dev/null; then
              SELF_OK+=("${sym}")
            elif [[ "${sym}" =~ sus_map|sus_memfd ]]; then
              # 이 워크플로는 CONFIG_KSU_SUSFS_SUS_MAP / SUS_MEMFD 를
              # 비활성화하고, "빌드 결과 검증" 단계가 그 상태를 재확인한다.
              IGNORED+=("${sym}")
            else
              REAL_MISSING+=("${sym}")
            fi
          done

          echo "ABI preflight: ${#CALLED_SYMS[@]} symbol(s) referenced from KernelSU-Next."
          echo "  resolved : ${#SELF_OK[@]}"
          echo "  ignored  : ${#IGNORED[@]} (SUS_MAP/SUS_MEMFD, disabled by defconfig)"

          if [ "${#IGNORED[@]}" -gt 0 ]; then
            for sym in "${IGNORED[@]}"; do echo "    - ${sym}"; done
          fi

          if [ "${#REAL_MISSING[@]}" -gt 0 ]; then
            KSUN_COMMIT_DATE="$(cat "${GITHUB_WORKSPACE}/ksun_commit_date.txt" 2>/dev/null || echo unknown)"
            echo
            echo "=================================================="
            echo "ERROR: KernelSU-Next / SUSFS ABI mismatch"
            echo "=================================================="
            echo "KernelSU-Next $(cat "${GITHUB_WORKSPACE}/ksun_commit.txt" 2>/dev/null || echo "${KSUN_REF}")"
            echo "  (tag ${KSU_VERSION_TAG}, commit date: ${KSUN_COMMIT_DATE})"
            echo "SUSFS ${SUSFS_VERSION:-unknown}"
            echo
            echo "다음 심볼이 커널 트리 어디에도 정의되어 있지 않습니다:"
            for sym in "${REAL_MISSING[@]}"; do echo "  - ${sym}"; done
            echo
            echo "no-op 스텁으로 덮지 마십시오. 이 심볼들은 반환값/자료형이"
            echo "실제로 쓰이므로(예: susfs_extra_works 는 KSUN에서"
            echo "struct work_struct 객체로 선언됨) 스텁을 붙이면"
            echo "선언 충돌로 컴파일이 깨지거나 은닉이 조용히 무력화됩니다."
            echo "SUSFS 쪽 소스를 KernelSU-Next 커밋과 짝이 맞는 것으로"
            echo "교체하는 것이 유일한 정답입니다."
            echo "=================================================="
            exit 1
          fi

          echo "KernelSU-Next / SUSFS ABI preflight: OK"

      - name: NoMount 통합
        shell: bash
        run: |
          set -euo pipefail

          KROOT="${GITHUB_WORKSPACE}/kernel_workspace/${KROOT_NAME}"
          cd "${KROOT}"

          rm -rf NoMount
          git clone --depth=1 --branch "${NOMOUNT_REF}" "${NOMOUNT_REPO}" NoMount

          NOMOUNT_COMMIT="$(git -C NoMount rev-parse HEAD)"
          echo "NoMount commit: ${NOMOUNT_COMMIT}"

          cd "${KROOT}"

          # 저장소 레이아웃이 바뀌어도 버티도록 Kconfig+소스가 같이 있는
          # 디렉터리를 찾아낸다.
          NOMOUNT_SRC="$(
            find NoMount -type f -name "Kconfig" -printf '%h\n' 2>/dev/null \
              | while read -r d; do
                  if ls "${d}"/*.c >/dev/null 2>&1; then echo "${d}"; break; fi
                done
          )"

          if [ -z "${NOMOUNT_SRC}" ]; then
            echo "ERROR: NoMount 소스 디렉터리를 찾지 못했습니다."
            find NoMount -maxdepth 3 -type f | sort | head -50
            exit 1
          fi
          echo "NoMount source dir: ${NOMOUNT_SRC}"

          NOMOUNT_SYMBOL="$(grep -oE '^[[:space:]]*config[[:space:]]+[A-Z0-9_]+' "${NOMOUNT_SRC}/Kconfig" | awk '{print $2}' | head -n 1)"
          if [ -z "${NOMOUNT_SYMBOL}" ]; then
            echo "ERROR: NoMount Kconfig 에서 config 심볼을 읽지 못했습니다."
            exit 1
          fi
          echo "NoMount Kconfig symbol: ${NOMOUNT_SYMBOL}"
          echo "NOMOUNT_SYMBOL=${NOMOUNT_SYMBOL}" >> "${GITHUB_ENV}"

          rm -rf fs/nomount
          mkdir -p fs/nomount
          rsync -a "${NOMOUNT_SRC}/" fs/nomount/

          grep -Fqx 'source "fs/nomount/Kconfig"' fs/Kconfig || \
            printf '\nsource "fs/nomount/Kconfig"\n' >> fs/Kconfig

          grep -Fqx "obj-\$(CONFIG_${NOMOUNT_SYMBOL}) += nomount/" fs/Makefile || \
            printf '\nobj-$(CONFIG_%s) += nomount/\n' "${NOMOUNT_SYMBOL}" >> fs/Makefile

          test -f fs/nomount/Kconfig
          echo "NoMount integration OK."

      - name: Sunfish defconfig 설정
        shell: bash
        run: |
          set -euo pipefail

          KROOT="${GITHUB_WORKSPACE}/kernel_workspace/${KROOT_NAME}"
          cd "${KROOT}"

          DEFCONFIG="arch/arm64/configs/sunfish_defconfig"
          test -f "${DEFCONFIG}"

          KSUN_KCONFIG="drivers/kernelsu/Kconfig"

          remove_config() {
            sed -i \
              -e "/^[[:space:]]*CONFIG_$1=.*/d" \
              -e "/^[[:space:]]*# CONFIG_$1 is not set$/d" \
              "${DEFCONFIG}"
          }

          set_bool() {
            local key="$1" value="$2"
            # KSUN Kconfig 에 실제로 존재하는 키만 반영한다.
            # (존재하지 않는 키를 밀어 넣으면 검증 단계가 거짓 실패한다.)
            if [ "${key}" = "KSU" ] || grep -qE "^[[:space:]]*config[[:space:]]+${key}\b" "${KSUN_KCONFIG}"; then
              remove_config "${key}"
              printf 'CONFIG_%s=%s\n' "${key}" "${value}" >> "${DEFCONFIG}"
            else
              echo "[SKIP] CONFIG_${key} 는 ${KSUN_KCONFIG} 에 없음"
            fi
          }

          disable_bool() {
            local key="$1"
            if [ "${key}" = "KSU" ] || grep -qE "^[[:space:]]*config[[:space:]]+${key}\b" "${KSUN_KCONFIG}" \
               || grep -qE "^[[:space:]]*config[[:space:]]+${key}\b" Kconfig arch/arm64/Kconfig 2>/dev/null; then
              remove_config "${key}"
              printf '# CONFIG_%s is not set\n' "${key}" >> "${DEFCONFIG}"
            else
              echo "[SKIP] CONFIG_${key} 는 대상 Kconfig 에 없음"
            fi
          }

          # setlocalversion 로 인한 UTS_RELEASE 길이 초과 방지는 그대로 유지한다.
          disable_bool LOCALVERSION_AUTO

          # Linux 4.14 -> manual hook 고정
          set_bool KSU y
          set_bool KSU_MANUAL_HOOK y
          disable_bool KSU_KPROBES_HOOK
          disable_bool KSU_SYSCALL_TABLE_HOOK

          # SUSFS
          set_bool KSU_SUSFS y
          set_bool KSU_SUSFS_SUS_PATH y
          set_bool KSU_SUSFS_SUS_MOUNT y
          set_bool KSU_SUSFS_SUS_KSTAT y
          set_bool KSU_SUSFS_TRY_UMOUNT y
          set_bool KSU_SUSFS_SPOOF_UNAME y
          set_bool KSU_SUSFS_ENABLE_LOG y
          set_bool KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS y
          set_bool KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG y
          set_bool KSU_SUSFS_OPEN_REDIRECT y
          disable_bool KSU_SUSFS_SUS_MAP
          disable_bool KSU_SUSFS_SUS_MEMFD

          # NoMount / overlayfs
          set_bool "${NOMOUNT_SYMBOL:-NOMOUNT}" y
          set_bool OVERLAY_FS y

          # BBR
          set_bool TCP_CONG_ADVANCED y
          set_bool TCP_CONG_BBR y
          remove_config DEFAULT_TCP_CONG
          printf 'CONFIG_DEFAULT_TCP_CONG="bbr"\n' >> "${DEFCONFIG}"

          echo "==== defconfig tail ===="
          tail -n 40 "${DEFCONFIG}"
          echo "Sunfish defconfig configured."

      - name: Google build config 복사
        shell: bash
        run: |
          set -euo pipefail

          KROOT="${GITHUB_WORKSPACE}/kernel_workspace/${KROOT_NAME}"
          cd "${KROOT}"

          cp build.config.sunfish build.config.sunfish.custom
          cat >> build.config.sunfish.custom <<'EOF'

          # Custom KernelSU-Next / SUSFS / NoMount build.
          POST_DEFCONFIG_CMDS=""
          SKIP_DEFCONFIG_CHECK=1
          EOF

          test -f build.config.sunfish.custom

      - name: 커널 빌드
        shell: bash
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}/kernel_workspace"
          rm -rf out

          export POST_DEFCONFIG_CMDS=""
          export SKIP_DEFCONFIG_CHECK=1
          export CONFIG_KSU_MANUAL_HOOK=y
          export KSU_VERSION_TAG="${KSU_VERSION_TAG}"
          if [ -n "${KSU_VERSION_OVERRIDE}" ]; then
            export KSU_VERSION_OVERRIDE="${KSU_VERSION_OVERRIDE}"
          fi

          set +e
          LTO=thin \
          BUILD_CONFIG=private/msm-google/build.config.sunfish.custom \
          V=1 \
          ./build/build.sh \
            2>&1 | tee "${GITHUB_WORKSPACE}/kernel-build.log"
          BUILD_STATUS="${PIPESTATUS[0]}"
          set -e

          if [ "${BUILD_STATUS}" -ne 0 ]; then
            echo
            echo "=================================================="
            echo "빌드 실패. 실제 원인으로 추정되는 로그 구간 (자동 추출):"
            echo "=================================================="
            grep -n -iE \
              "error:|error [0-9]+|missing separator|no rule to make target|undefined reference|multiple definition|fatal error|No such file or directory|implicit declaration" \
              "${GITHUB_WORKSPACE}/kernel-build.log" \
              | tail -n 80 || true
            echo "=================================================="
            exit "${BUILD_STATUS}"
          fi

      - name: 빌드 결과 검증
        shell: bash
        run: |
          set -euo pipefail

          KROOT="${GITHUB_WORKSPACE}/kernel_workspace/${KROOT_NAME}"
          OUT="${GITHUB_WORKSPACE}/kernel_workspace/out"
          cd "${KROOT}"

          CONFIG_FILE="$(find "${OUT}" -type f -path "*/${KROOT_NAME}/.config" | head -n 1)"
          test -n "${CONFIG_FILE}"
          echo "kernel .config: ${CONFIG_FILE}"

          require_yes() {
            grep -q "^$1=y$" "${CONFIG_FILE}" || { echo "ERROR: $1=y missing"; exit 1; }
          }
          require_not_y() {
            ! grep -q "^$1=y$" "${CONFIG_FILE}" || { echo "ERROR: $1=y must be disabled"; exit 1; }
          }

          require_yes CONFIG_KSU
          require_yes CONFIG_KSU_MANUAL_HOOK
          require_not_y CONFIG_KSU_KPROBES_HOOK
          require_not_y CONFIG_KSU_SYSCALL_TABLE_HOOK

          # SUSFS: 실제 Kconfig 에 존재하는 키만 검사한다.
          while read -r key; do
            [ -z "${key}" ] && continue
            case "${key}" in
              CONFIG_KSU_SUSFS_SUS_MAP|CONFIG_KSU_SUSFS_SUS_MEMFD) require_not_y "${key}" ;;
              *) require_yes "${key}" ;;
            esac
          done < <(grep -oE '^[[:space:]]*config[[:space:]]+KSU_SUSFS[A-Z0-9_]*' \
                     drivers/kernelsu/Kconfig | awk '{print "CONFIG_"$2}' | sort -u)

          require_yes "CONFIG_${NOMOUNT_SYMBOL:-NOMOUNT}"
          require_yes CONFIG_OVERLAY_FS
          require_yes CONFIG_TCP_CONG_ADVANCED
          require_yes CONFIG_TCP_CONG_BBR
          grep -q '^CONFIG_DEFAULT_TCP_CONG="bbr"$' "${CONFIG_FILE}" || {
            echo "ERROR: BBR is not the default TCP congestion control."; exit 1; }

          test -f fs/susfs.c
          test -f include/linux/susfs.h
          grep -Fq 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile
          test -e drivers/kernelsu/Kbuild
          test -f fs/nomount/Kconfig

          IMAGE="$(find "${OUT}" -type f -name "Image.lz4-dtb" | sort | head -n 1)"
          if [ -z "${IMAGE}" ]; then
            echo "ERROR: Image.lz4-dtb was not produced."
            find "${OUT}" -type f | sort | tail -200
            exit 1
          fi

          {
            echo "DEVICE=Pixel 4a"
            echo "CODENAME=sunfish"
            echo "BOOT_BUILD=TQ3A.230805.001.S1"
            echo "KERNEL_BRANCH=${KERNEL_BRANCH}"
            echo "KERNEL_VERSION=${KERNEL_VERSION:-$(make -s kernelversion)}"
            echo "KSUN_REPO=${KSUN_REPO}"
            echo "KSUN_REF=$(cat "${GITHUB_WORKSPACE}/ksun_commit.txt")"
            echo "KSU_VERSION_TAG=${KSU_VERSION_TAG}"
            echo "SUSFS_VERSION=${SUSFS_VERSION:-unknown}"
            echo "NOMOUNT_REPO=${NOMOUNT_REPO}"
            echo "NOMOUNT_REF=${NOMOUNT_REF}"
            echo "BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "IMAGE=${IMAGE}"
          } > "${GITHUB_WORKSPACE}/BUILD_INFO.txt"

          sha256sum "${IMAGE}" > "${GITHUB_WORKSPACE}/KERNEL_SHA256SUM.txt"

          echo "BUILD VERIFICATION: PASS"
          cat "${GITHUB_WORKSPACE}/BUILD_INFO.txt"
          sha256sum "${IMAGE}"

      - name: AnyKernel3 패키징
        shell: bash
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}"
          rm -rf AnyKernel3

          git clone --depth=1 --branch "${ANYKERNEL3_REF}" "${ANYKERNEL3_REPO}" AnyKernel3
          cd AnyKernel3

          IMAGE="$(find "${GITHUB_WORKSPACE}/kernel_workspace/out" -type f -name "Image.lz4-dtb" | sort | head -n 1)"
          test -n "${IMAGE}"
          cp "${IMAGE}" Image.lz4-dtb

          if grep -q '^device.name1=' anykernel.sh; then
            sed -i 's/^device\.name1=.*/device.name1=sunfish/' anykernel.sh
          else
            printf '\ndevice.name1=sunfish\n' >> anykernel.sh
          fi

          cp "${GITHUB_WORKSPACE}/BUILD_INFO.txt" BUILD_INFO.txt
          cp "${GITHUB_WORKSPACE}/KERNEL_SHA256SUM.txt" KERNEL_SHA256SUM.txt

          test -f Image.lz4-dtb

          cd "${GITHUB_WORKSPACE}"
          rm -f Sunfish-KernelSU-Next-SUSFS-NoMount-BBR.zip

          cd AnyKernel3
          zip -r9 \
            "${GITHUB_WORKSPACE}/Sunfish-KernelSU-Next-SUSFS-NoMount-BBR.zip" \
            . \
            -x ".git/*" \
            -x "README.md"

      - name: 최종 Artifact 업로드
        uses: actions/upload-artifact@v4
        with:
          name: Sunfish-KernelSU-Next-SUSFS-NoMount-BBR
          path: Sunfish-KernelSU-Next-SUSFS-NoMount-BBR.zip
          if-no-files-found: error
          retention-days: 30

      - name: 빌드 진단정보 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sunfish-Kernel-Build-Diagnostics
          path: |
            kernel-build.log
            susfs-patch.log
            BUILD_INFO.txt
            KERNEL_SHA256SUM.txt
          if-no-files-found: warn
          retention-days: 30
