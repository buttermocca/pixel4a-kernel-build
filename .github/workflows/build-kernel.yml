# .github/workflows/build-kernel.yml
name: Pixel 4a KernelSU-Next Build Workflow

on:
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: 'Pixel 4a Kernel Branch'
        required: true
        default: 'android-msm-pixel-4.14-android12-qpr3'

jobs:
  # 노드 1: 개발 환경 구성 및 소스코드 Sync
  setup-env:
    name: 1. Setup & Sync Source
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git gnupg gperf \
            liblz4-tool libncurses5-dev libsdl1.2-dev libxml2 libxml2-utils lzop \
            pngcrush schedtool squashfs-tools xsltproc zip zlib1g-dev python3 repo

      - name: Sync Pixel 4a Kernel Source
        run: |
          mkdir workspace
          cd workspace
          repo init -u https://android.googlesource.com/kernel/manifest -b ${{ github.event.inputs.KERNEL_BRANCH }} --depth=1
          repo sync -c -j$(nproc --all)

      - name: Upload Synced Workspace
        uses: actions/upload-artifact@v4
        with:
          name: synced-workspace
          path: workspace/
          retention-days: 1

  # 노드 2: KernelSU-Next 및 SUSFS 패치 적용 (의존성: setup-env)
  apply-patches:
    name: 2. Apply Patches
    needs: setup-env
    runs-on: ubuntu-22.04
    steps:
      - name: Download Synced Workspace
        uses: actions/download-artifact@v4
        with:
          name: synced-workspace
          path: workspace

      - name: Apply KernelSU-Next & SUSFS Patches
        run: |
          cd workspace/private/msm-google
          
          # 1. KernelSU-Next 설치
          curl -LSs "https://raw.githubusercontent.com/rifs33/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          
          # 2. Kernel 4.14용 SUSFS 패치 적용 (필요 시 패치 스크립트 지정)
          # git apply /path/to/susfs_kernel-4.14.patch || true
          
          # 3. C89 문법 오류(fs/notify/fdinfo.c) 방지 및 변수 선언부 패치 검증
          git status

      - name: Upload Patched Workspace
        uses: actions/upload-artifact@v4
        with:
          name: patched-workspace
          path: workspace/
          retention-days: 1

  # 노드 3: 커널 컴파일 (의존성: apply-patches)
  build-kernel:
    name: 3. Build Kernel
    needs: apply-patches
    runs-on: ubuntu-22.04
    steps:
      - name: Download Patched Workspace
        uses: actions/download-artifact@v4
        with:
          name: patched-workspace
          path: workspace

      - name: Compile Pixel 4a Kernel
        run: |
          cd workspace
          # Pixel 4a (sunfish) 빌드 스크립트 실행
          BUILD_CONFIG=private/msm-google/build.config.sunfish ./build/build.sh

      - name: Upload Compiled Kernel Binary
        uses: actions/upload-artifact@v4
        with:
          name: kernel-binary
          path: workspace/out/android-msm-pixel-4.14/private/msm-google/arch/arm64/boot/Image.lz4-dtb
          retention-days: 1

  # 노드 4: AnyKernel3 패키징 및 최종 아티팩트 업로드 (의존성: build-kernel)
  package-artifact:
    name: 4. Package AnyKernel3
    needs: build-kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Download Kernel Binary
        uses: actions/download-artifact@v4
        with:
          name: kernel-binary
          path: ./

      - name: Build AnyKernel3 Flashable Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AnyKernel3
          cp Image.lz4-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../Pixel4a-KernelSU-Next.zip *

      - name: Upload Final Release Zip
        uses: actions/upload-artifact@v4
        with:
          name: Pixel4a-KernelSU-Next-Flashable
          path: Pixel4a-KernelSU-Next.zip
          retention-days: 7
